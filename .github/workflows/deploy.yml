name: Deploy to Azure App Service

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "server.js"
      - "package.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure App Service settings
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            RESOURCE_GROUP=$(az webapp list \
              --query "[?name=='${{ vars.AZURE_WEBAPP_NAME }}'].resourceGroup" \
              -o tsv)
            az webapp config appsettings set \
              --name "${{ vars.AZURE_WEBAPP_NAME }}" \
              --resource-group "$RESOURCE_GROUP" \
              --settings \
                AZURE_SQL_SERVER_FQDN="${{ vars.AZURE_SQL_SERVER_FQDN }}" \
                AZURE_SQL_DATABASE_NAME="${{ vars.AZURE_SQL_DATABASE_NAME }}" \
                ENTRA_CLIENT_ID="${{ vars.ENTRA_CLIENT_ID }}" \
                ENTRA_TENANT_ID="${{ vars.ENTRA_TENANT_ID }}" \
                AZURE_ADMIN_UAMI_CLIENT_ID="${{ vars.AZURE_ADMIN_UAMI_CLIENT_ID }}" \
                AZURE_STORAGE_ACCOUNT_NAME="${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: .
